services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
